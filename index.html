    <section class="site-intro" id="site-intro" role="dialog" aria-modal="true" aria-labelledby="intro-title" hidden>
      <div class="intro-heading">
        <h2 id="intro-title">太空观测记录</h2>
        <a class="intro-stars" href="https://github.com/cloud-oc/Secret-Sealing-Club" target="_blank" rel="noreferrer" aria-label="GitHub Stars">
          <img src="https://img.shields.io/github/stars/cloud-oc/Secret-Sealing-Club?style=for-the-badge&logo=github&label=Stars&color=56d6bd&labelColor=16252b" alt="GitHub Stars" />
        </a>
      </div>
      <div class="intro-copy">
        <p id="intro-about">
          秘封俱乐部是《东方Project》及其衍生作品中登场的一个架空的秘密结社。这里收录着九张秘封俱乐部的音乐 CD 读本。
        </p>
        <p id="intro-experience">
          选一张专辑，曲目会带着对应的故事段落一起亮起，就像驶在太空的列车行窗外闪烁的星星。
        </p>
        <p id="intro-note">
          阅读进度、语言与播放位置会保存在你的浏览器里。再次打开时，可以从上次停下的地方继续观测。
        </p>
        <p id="intro-repo">
          该项目位于 <a href="https://github.com/cloud-oc/Secret-Sealing-Club" target="_blank" rel="noreferrer">GitHub</a> 上。喜欢就加个 Star 吧！欢迎贡献。
        </p>
        <p id="intro-feedback">
          在这里发送你的使用反馈或报告 Bug。
        </p>
      </div>
      <button class="gate-replay" id="gate-replay" type="button">重播开场动画</button>
      <button class="intro-close" id="intro-close" type="button" aria-label="关闭简介">关闭</button>
    </section>

    <div class="player-shell" id="player-shell" aria-label="音乐播放器">

          <a class="player-track-link" id="player-title" href="#" target="_blank" rel="noreferrer">

          <small id="player-album">秘封俱乐部</small>
        </div>
      </div>

      <div class="player-center">
        <div class="player-controls">
          <button class="icon-button" id="prev-track" type="button" aria-label="上一首">

          </button>
          <button class="play-button" id="play-toggle" type="button" aria-label="播放或暂停">

          </button>

          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度" />
          <span id="duration">0:00</span>
        </div>
      </div>

        class="playlist-toggle"
        id="playlist-toggle"
        type="button"
        aria-label="展开曲目列表"
        aria-controls="playlist-panel"
        aria-expanded="false"

      <div class="playlist-panel" id="playlist-panel" hidden></div>
